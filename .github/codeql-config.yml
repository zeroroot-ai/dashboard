# CodeQL configuration. Pin bundle + queries via Renovate (PRD 1.5).
name: "zeroroot-ai default CodeQL config"

# The one place that names the query suite. Each CodeQL repo of the org uses
# `security-extended`. The workflow passes no `queries` input, so this file
# and the workflow cannot disagree.
queries:
  - uses: security-extended

# Exclude generated code paths from analysis surface.
paths-ignore:
  - "**/zz_generated*.go"
  - "**/*.pb.go"
  - "**/*_grpc.pb.go"
  - "vendor/**"
  - "**/testdata/**"
  - "**/.worktrees/**"
