name: authz-registry-drift

# Cross-repo freshness gate for src/gen/ (proto bindings) and
# src/gen/authz/registry.ts against the CURRENT zeroroot-ai/gibson main.
#
# node-ci.yml's reusable workflow (both the fast and heavy tiers) calls
# check-proto-bindings-fresh.mjs / check-authz-registry-fresh.mjs in a
# single-repo dashboard checkout. No `gibson` checkout is on disk there, so
# those two gates can only ever run in STRUCTURAL mode (file exists,
# non-empty, carries the generator header). They cannot tell a stale relation
# string or a removed RPC from a healthy one. That gap is what let a proto
# rename on gibson main sit undetected in the committed registry.ts and
# src/gen/ until an unrelated PR ran the real generators on a workstation.
#
# This workflow has the gibson daemon-local protos on disk, so it is the one
# that can catch that class of drift. It is intentionally NOT folded into
# node-ci.yml: that would put a second-repo checkout and a buf module fetch on
# the critical path of every dashboard PR. Scheduled + workflow_dispatch
# instead, the same shape the org uses for cross-repo drift checks that must
# not block every PR of the repo they run in.
#
# Needs no secret beyond the default GITHUB_TOKEN. zeroroot-ai/gibson is
# public, so its checkout needs no credential. Both generators read the SDK
# protos from the public module buf.build/zeroroot-ai/sdk at the release that
# scripts/lib/sdk-proto-source.mjs names (dashboard#217, dashboard#240). The
# registry serves a public module with no token. The generators have no
# offline path, so a registry that is not reachable fails this run. No Go
# toolchain is needed.
#
# The rbac-inventory job does the same for docs/AUTH_RBAC_INVENTORY.md against
# the golden render of the public charts repository. node-ci has no charts
# checkout, so check-auth-rbac-inventory-fresh.mjs runs there in STRUCTURAL
# mode only. That is how the inventory drifted from charts main with no red
# check (dashboard#269).

on:
  schedule:
    - cron: "17 6 * * *" # daily, off the hour so it doesn't compete with other repos' cron jobs
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/authz-registry-drift.yml"
      - "scripts/proto-generate.mjs"
      - "scripts/gen-authz-registry.mjs"
      - "scripts/lib/freshness-gate.mjs"
      - "scripts/lib/sdk-proto-source.mjs"
      - "scripts/gen-auth-rbac-inventory.mjs"
      - "scripts/check-auth-rbac-inventory-fresh.mjs"

concurrency:
  group: authz-registry-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: proto + authz registry drift vs gibson main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout gibson main (public, no token required)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/gibson
          ref: main
          path: _gws/gibson
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.34.5"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Confirm FULL mode (the gibson protos are on disk)
        env:
          GIBSON_WORKSPACE_ROOT: ${{ github.workspace }}/_gws
        run: |
          set -euo pipefail
          probe="$(node scripts/proto-generate.mjs --probe)"
          echo "$probe"
          available="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).available))' "$probe")"
          if [ "$available" != "true" ]; then
            echo "::error::gibson sibling not resolved; this run would silently degrade to STRUCTURAL mode and pass vacuously." >&2
            exit 1
          fi

      - name: Proto bindings drift (FULL mode)
        env:
          GIBSON_WORKSPACE_ROOT: ${{ github.workspace }}/_gws
        run: node scripts/check-proto-bindings-fresh.mjs

      - name: Authz registry drift (FULL mode)
        env:
          GIBSON_WORKSPACE_ROOT: ${{ github.workspace }}/_gws
        run: node scripts/check-authz-registry-fresh.mjs

  rbac-inventory:
    name: RBAC inventory drift vs charts main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout charts main (public, no token required)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/charts
          ref: main
          path: _gws/charts
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.34.5"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Confirm FULL mode (the charts golden render is on disk)
        env:
          GIBSON_WORKSPACE_ROOT: ${{ github.workspace }}/_gws
        run: |
          set -euo pipefail
          probe="$(node scripts/gen-auth-rbac-inventory.mjs --probe)"
          echo "$probe"
          available="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).available))' "$probe")"
          if [ "$available" != "true" ]; then
            echo "::error::charts sibling not resolved; this run would degrade to STRUCTURAL mode and pass vacuously." >&2
            exit 1
          fi

      - name: RBAC inventory drift (FULL mode)
        env:
          GIBSON_WORKSPACE_ROOT: ${{ github.workspace }}/_gws
        run: node scripts/check-auth-rbac-inventory-fresh.mjs
