name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.SDK_FANOUT_APP_ID }}
          private-key: ${{ secrets.SDK_FANOUT_APP_PRIVATE_KEY }}
          owner: zeroroot-ai
          repositories: dashboard

      - uses: googleapis/release-please-action@v5
        with:
          # Mint a short-lived token from the zeroday-sdk-fanout GitHub App rather
          # than using GITHUB_TOKEN or a long-lived PAT. GITHUB_TOKEN does not fire
          # downstream `push: tags:` workflows (GitHub anti-recursion) and its
          # bot-authored PRs get held at action_required; a PAT avoids both but
          # expires, which reproduces the same silent stall on a timer. An App token
          # has neither failure mode. See zeroroot-ai/.github#263.
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
