# Calls the org-level reusable ADR-0009 deny-list workflow.
# See zeroroot-ai/.github/.github/workflows/vault-auth-method-deny-list.yml
# for the scanner logic. The deny-list itself comes from ADR-0009, the Vault
# auth-method decision record.
#
# Required check name: vault-auth-method-deny-list

name: vault-auth-method-deny-list

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  vault-auth-method-deny-list:
    uses: zeroroot-ai/.github/.github/workflows/vault-auth-method-deny-list.yml@b7a142c4432492ada621d7603a676d0a3f7f8044 # main, 2026-09-15: pin every first-party reusable (.github#66)
