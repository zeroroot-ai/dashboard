name: CodeQL

# The scan is the shared workflow of zeroroot-ai/.github (ADR-0018, D38). It
# runs the suite security-extended and the custom TypeScript queries of the
# organization. This repo keeps no CodeQL config file and no query list.
#
# Cadence: merge_group is the gate before a merge, and the weekly schedule is
# the deep scan. workflow_dispatch forces a scan of refs/heads/main, so that an
# alert that the source already fixed closes before the next weekly run.
#
# On a pull_request the job runs with `scan: false`. It skips each step and
# reports success under the same check name, because a ruleset blocks queue
# entry until each required check reports on the pull request.
#
# The check name is `CodeQL / CodeQL (javascript-typescript)`. The ruleset of
# this repo in zeroroot-ai/.github requires that name.

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@96b8fa3f95163ce097194672a80f1317830503d4 # v0.17.5
    with:
      languages: '["javascript-typescript"]'
      scan: ${{ github.event_name != 'pull_request' }}
      paths-ignore: |
        **/.worktrees/**
