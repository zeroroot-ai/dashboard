name: CodeQL

# The scan is the shared workflow of zeroroot-ai/.github (ADR-0018, D38). It
# runs the suite security-extended and the custom TypeScript queries of the
# organization. This repo keeps no CodeQL config file and no query list.
#
# Cadence: merge_group is the gate before a merge. A push to main scans
# refs/heads/main, so an alert closes when its fix merges. workflow_dispatch forces a
# scan of refs/heads/main on demand.
#
# On a pull_request the job runs with `scan: false`. It skips each step and
# reports success under the same check name, because a ruleset blocks queue
# entry until each required check reports on the pull request.
#
# The check name is `CodeQL / CodeQL (javascript-typescript)`. The ruleset of
# this repo in zeroroot-ai/.github requires that name.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@7626d9726b593f0e33bc668626e0dbe8771eee19 # v0.20.1
    with:
      languages: '["javascript-typescript"]'
      scan: ${{ github.event_name != 'pull_request' }}
      paths-ignore: |
        **/.worktrees/**
